name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked --all-groups --python 3.11
      - name: Verify tag matches package version
        run: >-
          uv run --no-sync python -c
          "import os, stateslate; expected = 'v' + stateslate.__version__;
          actual = os.environ['GITHUB_REF_NAME'];
          raise SystemExit(0 if actual == expected else f'{actual} != {expected}')"
      - run: uv run --no-sync python scripts/check.py
      - run: uv build --no-sources --clear --no-create-gitignore --out-dir dist
      - run: uv run --no-sync python scripts/package_release.py --dist dist --out release-assets
      - name: Publish GitHub Release
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --verify-tag --title "StateSlate $GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
