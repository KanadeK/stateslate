<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1120 550" width="1120" height="550">
<title>StateSlate continuity timeline for Moonlit Letter</title>
<desc>Story order appears on the left and scheduled shoot order on the right.</desc>
<style>
.title{font:700 28px system-ui,sans-serif;fill:#17213b}
.heading{font:700 15px system-ui,sans-serif;letter-spacing:.12em;fill:#59637d}
.meta{font:600 13px system-ui,sans-serif;fill:#59637d}
.scene{font:700 17px system-ui,sans-serif;fill:#17213b}
</style>
<rect width="1120" height="550" fill="#f4f1ea"/>
<text x="40" y="48" class="title">Moonlit Letter</text>
<text x="40" y="84" class="heading">STORY ORDER · STATE AUTHORITY</text>
<text x="580" y="84" class="heading">SHOOT ORDER · RESET PLAN</text>
<rect x="40" y="105" width="500" height="78" rx="14" fill="#ffffff" stroke="#635bff" stroke-width="2"/>
<text x="60" y="133" class="meta">Story 10</text>
<text x="60" y="161" class="scene">S10 · The letter arrives</text>
<rect x="40" y="205" width="500" height="78" rx="14" fill="#ffffff" stroke="#635bff" stroke-width="2"/>
<text x="60" y="233" class="meta">Story 20</text>
<text x="60" y="261" class="scene">S20 · Rain in the alley</text>
<rect x="40" y="305" width="500" height="78" rx="14" fill="#ffffff" stroke="#635bff" stroke-width="2"/>
<text x="60" y="333" class="meta">Story 30</text>
<text x="60" y="361" class="scene">S30 · The diner confession</text>
<rect x="40" y="405" width="500" height="78" rx="14" fill="#ffffff" stroke="#635bff" stroke-width="2"/>
<text x="60" y="433" class="meta">Story 40</text>
<text x="60" y="461" class="scene">S40 · Morning pickup</text>
<rect x="580" y="105" width="500" height="78" rx="14" fill="#ffffff" stroke="#d1495b" stroke-width="2"/>
<text x="600" y="133" class="meta">Day 1 · order 1</text>
<text x="600" y="161" class="scene">S20 · Rain in the alley</text>
<rect x="580" y="205" width="500" height="78" rx="14" fill="#ffffff" stroke="#1d8a72" stroke-width="2"/>
<text x="600" y="233" class="meta">Day 1 · order 2</text>
<text x="600" y="261" class="scene">S30 · The diner confession</text>
<rect x="580" y="305" width="500" height="78" rx="14" fill="#ffffff" stroke="#1d8a72" stroke-width="2"/>
<text x="600" y="333" class="meta">Day 4 · order 1</text>
<text x="600" y="361" class="scene">S10 · The letter arrives</text>
<rect x="580" y="405" width="500" height="78" rx="14" fill="#ffffff" stroke="#d1495b" stroke-width="2"/>
